<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ============ PRIMARY SEO ============ -->
    <title>Life Change Taker – Free Habit &amp; Daily Challenge Tracker</title>
    <meta name="description" content="Start a free personal challenge for 7, 21, 40 days or more. Set your own goal, track daily progress, build streaks and celebrate your wins with Life Change Taker." />
    <meta name="author" content="Life Change Taker" />
    <meta name="application-name" content="Life Change Taker" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- ============ BROWSER / PWA ============ -->
    <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Life Change Taker" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ============ LOGO / ICONS (files go in the /public folder) ============ -->
    <link rel="icon" href="/src/assets/images/logo.png" sizes="any" />
 

    <!-- ============ OPEN GRAPH (Facebook, WhatsApp, LinkedIn) ============ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Life Change Taker" />
    <meta property="og:title" content="Life Change Taker – Free Habit &amp; Daily Challenge Tracker" />
    <meta property="og:description" content="Pick a challenge, set your goal, track every day and celebrate your progress. Small steps. Big changes." />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Life Change Taker – habit and daily challenge tracker" />
    <meta property="og:locale" content="en_US" />

    <!-- ============ TWITTER / X ============ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Life Change Taker – Free Habit &amp; Daily Challenge Tracker" />
    <meta name="twitter:description" content="Pick a challenge, set your goal, track every day and celebrate your progress. Small steps. Big changes." />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta name="twitter:image:alt" content="Life Change Taker – habit and daily challenge tracker" />

    <!-- ============ FONTS ============ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- ============ STRUCTURED DATA (JSON-LD) ============ -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Life Change Taker",
        "url": "https://YOUR-DOMAIN.com/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": "en",
        "description": "A free habit and daily challenge tracker. Choose 7, 21, 40 days or more, set your own goal, track daily progress and celebrate your achievements.",
        "image": "https://YOUR-DOMAIN.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Challenges from 7 up to 300 days",
          "Write your own goal or pick a category",
          "Daily completion tracking in your local timezone",
          "Progress stats and calendar view",
          "Shareable achievement card",
          "Privacy-first: data stays in your browser"
        ]
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Life Change Taker",
        "url": "https://YOUR-DOMAIN.com/",
        "inLanguage": "en"
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Life Change Taker",
        "url": "https://YOUR-DOMAIN.com/",
        "logo": "https://YOUR-DOMAIN.com/icon-512.png"
      }
    ]
    </script>

    <!-- ============ THEME (no flash) ============ -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('life_change_taker_theme');
          var isDark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="bg-stone-50 text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-amber-900 dark:selection:text-amber-100 transition-colors duration-200">
    <div id="root"></div>

    <!-- Content for search engines / users without JavaScript -->
    <noscript>
      <main style="max-width:640px;margin:48px auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Life Change Taker – Free Habit &amp; Daily Challenge Tracker</h1>
        <p>
          Build better habits with 7, 21, 40-day or longer challenges. Set your own
          goal, track your progress every day and celebrate your achievements.
        </p>
        <p>Please enable JavaScript to use this app.</p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
